# ==============================================================================
# borgmatic configuration: one archive per run of the whole server, including
# all docker volumes and bind mounts, written to a local and an offsite repo.
#
# Do not run borgmatic against this file directly. backup.sh sources CONFIG.sh,
# exports the ${...} variables used below, generates the patterns file (source
# directories, nested mounts and excludes) and writes a config that includes
# this one plus the snapshot settings (lvm/btrfs) that fit the host.
# Requires borgmatic >= 2.0 and borg >= 1.4.
# ==============================================================================

repositories:
    - path: ${BACKUP_LOC}/${BORG_REPO_NAME}
      label: local
    - path: ${BACKUP_SSH}/${BORG_REPO_NAME}
      label: offsite

# Roots and excludes, generated by backup.sh on every run
patterns_from:
    - ${PATTERNS_FILE}

# Nested mounts are listed as roots of their own in the patterns file, so they
# are snapshotted separately (if on LVM) and never stored twice.
one_file_system: true
exclude_caches: true
exclude_if_present:
    - .nobackup
source_directories_must_exist: true

encryption_passcommand: head -n 1 -- ${BORG_PASS_FILE}
lock_wait: 600
statistics: standard

keep_daily: 7
keep_weekly: 4
keep_monthly: 12

checks:
    - name: repository
      frequency: 2 weeks
    - name: archives
      frequency: 1 month
    - name: data
      frequency: 3 months

commands:
    # Once per run, while all containers are still up
    - before: configuration
      when: [create]
      run:
          - ${SCRIPT_DIR}/hooks/pkglist.sh
          - ${SCRIPT_DIR}/hooks/exports.sh
    # Containers are down only while each repository's archive is written;
    # prune, compact and check run with them up again
    - before: action
      when: [create]
      run:
          - ${SCRIPT_DIR}/hooks/containers.sh stop
    - after: action
      when: [create]
      run:
          - ${SCRIPT_DIR}/hooks/containers.sh start
    - after: error
      run:
          - ${SCRIPT_DIR}/hooks/containers.sh start

healthchecks:
    ping_url: ${HCHK_SERVER_BACKUP}
