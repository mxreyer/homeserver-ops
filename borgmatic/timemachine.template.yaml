# ==============================================================================
# borgmatic configuration for homeserver-ops: the Time Machine sparse bundles
# (TIMEMACHINE_DIRS), backed up to their own offsite repository only. The Macs' own
# Time Machine backups are the local copy, so the main config excludes them.
#
# Generated by configure-borgmatic.sh from borgmatic/timemachine.template.yaml
# and CONFIG.sh into /etc/borgmatic.d/, where borgmatic picks it up next to
# /etc/borgmatic/config.yaml in the same run. Edit those, not the generated file.
# ==============================================================================

# Its own repository on the offsite machine, separate from the server's, so
# checks, rollbacks and compaction of the two stay independent
repositories:
    - path: '${BORG_REPO_OFFSITE_TMCHN}'
      label: offsite-tmchn

source_directories:
${TIMEMACHINE_DIRS_YAML}

# Distinct from the server's "<hostname>-..." archives, which keeps them apart
# even if both ever end up in one repository
archive_name_format: 'timemachine-{now:%Y-%m-%dT%H:%M:%S}'

exclude_caches: true
source_directories_must_exist: true

encryption_passcommand: 'cat ${BORG_PASS_FILE}'
lock_wait: 600
statistics: standard

keep_daily: 7
keep_weekly: 4
keep_monthly: 12

# As in the main config: the repository check verifies every stored block on
# the offsite machine itself, capped at 3 hours per run (the next run continues
# where it stopped); the archives check reads only metadata
checks:
    - name: repository
      frequency: 1 week
      max_duration: 10800
    - name: archives
      frequency: 1 month

# Samba is stopped while the bundles are archived, so no Mac writes to them
# mid-backup
commands:
    - before: action
      when: [create]
      run:
          - systemctl stop ${TIMEMACHINE_SERVICE}
    - after: action
      when: [create]
      run:
          - systemctl start ${TIMEMACHINE_SERVICE}
    - after: error
      run:
          - systemctl start ${TIMEMACHINE_SERVICE}

healthchecks:
    ping_url: '${HCHK_TIMEMACHINE_BACKUP}'
