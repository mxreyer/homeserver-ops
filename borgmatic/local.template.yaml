# ==============================================================================
# borgmatic configuration for homeserver-ops, local repository: one archive per
# run of the whole server, including all docker volumes and bind mounts.
# Runs daily from cron. The offsite repository has its own config,
# /etc/borgmatic.d/offsite.yaml, with its own schedule and retention.
# Requires borgmatic >= 2.0 and borg >= 1.4.
#
# Generated by configure-borgmatic.sh from borgmatic/local.template.yaml,
# borgmatic/common.template.yaml and CONFIG.sh. Edit those (general behaviour
# in the templates, host-specific values in CONFIG.sh) and rerun the script,
# not the generated file.
# ==============================================================================

repositories:
    - path: '${BORG_REPO_LOCAL}'
      label: local

keep_daily: 7
keep_weekly: 4
keep_monthly: 12

commands:
    # Shared with the offsite config, from borgmatic/commands.template.yaml
${COMMON_COMMANDS_YAML}
    # Local only: record the successful backup that auto-container-update.sh
    # requires (the daily local backup alone provides it)
    - after: configuration
      when: [create]
      states: [finish]
      run:
          - ${REPO_DIR}/hooks/backup-ok.sh

healthchecks:
    ping_url: '${HCHK_SERVER_BACKUP}'

