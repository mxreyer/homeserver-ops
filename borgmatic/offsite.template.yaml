# ==============================================================================
# borgmatic configuration for homeserver-ops, offsite repository: one archive
# per run of the whole server, with the same contents as the local archives.
# Runs weekly from cron, separately from the daily local backup, and keeps
# more monthly and yearly archives. Requires borgmatic >= 2.0 and borg >= 1.4.
#
# Generated by configure-borgmatic.sh from borgmatic/offsite.template.yaml,
# borgmatic/common.template.yaml and CONFIG.sh into /etc/borgmatic.d/. Edit
# those, not the generated file.
# ==============================================================================

repositories:
    - path: '${BORG_REPO_OFFSITE}'
      label: offsite

# One archive a week. The repository is append-only, so pruning only hides
# archives until you compact it on the offsite machine (README, Maintenance).
keep_weekly: 8
keep_monthly: 24
keep_yearly: 5

# The same hooks as the local config, except the success marker: the daily
# local backup alone provides the fresh backup auto-container-update.sh needs
commands:
    # Once per run, while all containers are still up
    - before: configuration
      when: [create]
      run:
          - ${REPO_DIR}/hooks/pkglist.sh
          - ${REPO_DIR}/hooks/exports.sh
    # Containers are down only while the archive is written; prune, compact
    # and check run with them up again
    - before: action
      when: [create]
      run:
          - ${REPO_DIR}/hooks/containers.sh stop
    - after: action
      when: [create]
      run:
          - ${REPO_DIR}/hooks/containers.sh start
    - after: error
      run:
          - ${REPO_DIR}/hooks/containers.sh start

healthchecks:
    ping_url: '${HCHK_OFFSITE_BACKUP}'

