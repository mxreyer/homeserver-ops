# ==============================================================================
# borgmatic configuration for homeserver-ops: one archive per run of the whole
# server, including all docker volumes and bind mounts, written to a local and
# an offsite repository. Requires borgmatic >= 2.0 and borg >= 1.4.
#
# Generated by configure-borgmatic.sh from borgmatic/config.template.yaml and
# CONFIG.sh. Edit those (general behaviour in the template, host-specific
# values in CONFIG.sh) and rerun the script, not the generated file.
# ==============================================================================

repositories:
    - path: '${BORG_REPO_LOCAL}'
      label: local
    - path: '${BORG_REPO_OFFSITE}'
      label: offsite

source_directories:
    - /etc
    - /home
    - /root
    - /usr/local
    - /opt
    - /var/lib            # includes docker's named volumes (/var/lib/docker/volumes)
    - /var/spool/cron
    - /boot
    - /mnt
    - '${DOCKER_BINDS_DIR}'
${EXTRA_BACKUP_DIRS_YAML}

# Borg follows file systems mounted below these directories (e.g. /boot/efi,
# /boot/firmware, a disk under /mnt). Exclude any that must not be backed up,
# such as network mounts, with EXTRA_EXCLUDES in CONFIG.sh.
exclude_patterns:
    # The local repository itself, in case it lies below a backed-up directory
    - '${BORG_REPO_LOCAL}'
    # Docker's images, containers and caches; only its volumes are backed up
    - /var/lib/docker/overlay2
    - /var/lib/docker/image
    - /var/lib/docker/containers
    - /var/lib/docker/buildkit
    - /var/lib/docker/tmp
    - /var/lib/docker/network
    - /var/lib/docker/plugins
    - /var/lib/docker/runtimes
    - /var/lib/docker/swarm
    - /var/lib/docker/containerd
    # Nextcloud AIO backs itself up with its own borg
    - /var/lib/docker/volumes/nextcloud_aio_*
    # Other container runtimes and system state that need no backup
    - /var/lib/containers
    - /var/lib/containerd
    - /var/lib/rancher/k3s/agent
    - /var/lib/flatpak
    - /var/lib/systemd
    - /var/lib/kubelet
    - /var/lib/lxcfs      # virtual file system on hosts with LXD, like /proc
    - /var/cache
    - /var/tmp
    # Immich can regenerate these
    - '${DOCKER_BINDS_DIR}/immich/library/thumbs'
    - '${DOCKER_BINDS_DIR}/immich/library/encoded-video'
${EXTRA_EXCLUDES_YAML}
    # Time Machine sparse bundles go to the offsite repository only, from
    # /etc/borgmatic.d/timemachine.yaml
${TIMEMACHINE_DIRS_YAML}

exclude_caches: true
exclude_if_present:
    - .nobackup
source_directories_must_exist: true

encryption_passcommand: 'cat ${BORG_PASS_FILE}'
lock_wait: 600
statistics: standard

keep_daily: 7
keep_weekly: 4
keep_monthly: 12

# Checks sized for repositories of several TB. The full data verification
# (reading and decrypting everything) is not part of the nightly run: it runs
# twice a year for the local repository only, from its own cron line (README).
checks:
    # Verifies the checksum of every stored block (on the remote machine for
    # the offsite repository, without downloading anything). Capped at 3 hours
    # per run; the next run continues where it stopped.
    - name: repository
      frequency: 1 week
      max_duration: 10800
    # Reads only metadata: every archive is readable and complete
    - name: archives
      frequency: 1 month

# The hooks live in the homeserver-ops checkout
commands:
    # Once per run, while all containers are still up
    - before: configuration
      when: [create]
      run:
          - ${REPO_DIR}/hooks/pkglist.sh
          - ${REPO_DIR}/hooks/exports.sh
    # Containers are down only while each repository's archive is written;
    # prune, compact and check run with them up again
    - before: action
      when: [create]
      run:
          - ${REPO_DIR}/hooks/containers.sh stop
    - after: action
      when: [create]
      run:
          - ${REPO_DIR}/hooks/containers.sh start
    - after: error
      run:
          - ${REPO_DIR}/hooks/containers.sh start
    # Record the successful backup that auto-container-update.sh requires
    - after: configuration
      when: [create]
      states: [finish]
      run:
          - ${REPO_DIR}/hooks/backup-ok.sh

healthchecks:
    ping_url: '${HCHK_SERVER_BACKUP}'
